<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculators have moved | LoansFlow</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://loansflow.loan/loans/">
  <meta http-equiv="refresh" content="1; url=/loans/">
  <script>
    // Old shared links used ?step=N. Send them to the page that now holds that calculator.
    (function () {
      var m = /[?&]step=(\d+)/.exec(location.search), s = m ? +m[1] : -1;
      var to = { 0: '/loans/sba-7a.html', 1: '/loans/sba-7a.html', 2: '/loans/line-of-credit.html', 8: '/news/' }[s] || (s >= 3 && s <= 7 ? '/loans/mortgage.html' : '/loans/');
      location.replace(to);
    })();
  </script>
</head>
<body style="font-family:system-ui,sans-serif;background:#0a0a0b;color:#e8e8ec;padding:3rem">
  <p>The calculators now live on each loan-type page. <a href="/loans/" style="color:#34d59a">Go to loan types</a>.</p>
</body>
</html>
