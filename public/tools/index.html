<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculators — LoansFlow</title>
  <meta name="description" content="SBA 7(a), SBA 504, commercial DSCR, line of credit, and mortgage calculators — free on LoansFlow.">
  <link rel="canonical" href="https://loansflow.loan/tools/">
  <meta property="og:title" content="LoansFlow Calculators">
  <meta property="og:description" content="Free SBA, commercial, and mortgage calculators with live amortization and DSCR.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://loansflow.loan/tools/">
  <meta property="og:image" content="https://loansflow.loan/img/logo.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://loansflow.loan/img/logo.png">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="google-adsense-account" content="ca-pub-7523216981025331">
  <link rel="icon" type="image/svg+xml" href="../img/logo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png">
  <link rel="shortcut icon" href="../favicon.ico">

  <link rel="apple-touch-icon" sizes="180x180" href="../img/apple-touch-180.png">
  <!-- Ezoic JS integration (Incubator detection). Official header from docs.ezoic.com/docs/ezoicads/integration  domain-bound, no per-site script ID. Publisher userId 652581. AdSense stays primary. -->
  <script data-cfasync="false" src="https://cmp.gatekeeperconsent.com/min.js"></script>
  <script data-cfasync="false" src="https://the.gatekeeperconsent.com/cmp.min.js"></script>
  <script async src="https://www.ezojs.com/ezoic/sa.min.js"></script>
  <script>
    window.ezstandalone = window.ezstandalone || {};
    window.ezstandalone.cmd = window.ezstandalone.cmd || [];
  </script>
  <script src="https://ezoicanalytics.com/analytics.js"></script>
  <script src="../js/ezoic-boot.js"></script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7523216981025331" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>
  <div class="app">
    <nav class="sidebar" aria-label="Calculator navigation">
      <div class="brand">
        <a href="../"><img src="../img/logo.svg" alt="LoansFlow" width="160" height="46" decoding="async"></a>
        <span>SBA &amp; Commercial Loan Tools</span>
      </div>
      <button class="btn-utility sidebar-wizard-btn" id="restartWizard" type="button" title="Answer two quick questions to jump to the right calculator">&#129517; Guided wizard</button>
      <ul class="steps" id="stepNav"></ul>
      <div class="ad-slot ad-slot--sidebar" data-ad-format="rectangle" data-ad-name="tools-sidebar"></div>
      <div class="sidebar-foot">
        Figures are estimates for planning purposes only and do not constitute a loan offer. Consult a licensed lender for exact terms.
      </div>
    </nav>
    <div class="main-wrap">
      <div class="ad-slot ad-slot--leaderboard" data-ad-format="horizontal" data-ad-name="tools-top"></div>
      <main class="main" id="mainContent"></main>
    </div>
  </div>


  <script>
    window.LOANSFLOW_ADS = { provider: 'adsense', adsenseClient: 'ca-pub-7523216981025331' };
    (function () {
      const step = parseInt(new URLSearchParams(location.search).get('step') || '', 10);
      if (!isNaN(step) && step >= 0 && step <= 8) window.__LF_INITIAL_STEP = step;
    })();
  </script>
  <script src="../js/app.js"></script>
  <script src="../js/ads.js" defer></script>
  <div class="lf-offers" data-lf-offers="tools-footer" hidden style="max-width:980px;margin:0 auto;padding:0 1.25rem 2rem;"></div>
  <script src="../js/offers.js" defer></script>
</body>
</html>
