# Cloudflare Pages — manual only until secrets exist
# Add repo secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID, then run this workflow.
# Or connect the repo in Cloudflare Dashboard → Workers & Pages (output dir: public).

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: loansflow
          directory: public
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
