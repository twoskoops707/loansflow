# Rebuilds the SBA 7(a) data study and state pages whenever SBA posts a new quarterly FOIA file.
# SBA updates data.sba.gov/dataset/7a-504-foia quarterly (about a month after quarter end); this checks weekly and only commits on change.
name: refresh-sba-data

on:
  schedule:
    - cron: '30 13 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-sba-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pandas
        run: pip install --no-input pandas
      - name: Download SBA files, aggregate, rebuild pages
        run: |
          python3 scripts/sba-foia/fetch.py
          python3 -I scripts/sba-foia/aggregate.py
          node scripts/sba-foia/build-pages.js
          python3 scripts/apply-nav.py
          python3 scripts/add-adsense-script.py
          node scripts/build-llms.js
          node scripts/build-sitemap.js
          node scripts/check-internal-links.js
      - name: Commit if changed
        run: |
          if git diff --quiet -- public; then
            echo "No SBA data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          git commit -m "chore: refresh SBA 7(a) data study $(date -u +%Y-%m-%d)"
          git push
